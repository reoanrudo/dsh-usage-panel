<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#1c2233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#4fd1a5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- fake panel card -->
  <g transform="translate(700 110)">
    <rect width="380" height="420" rx="18" fill="#ffffff" opacity="0.96"/>
    <text x="24" y="40" font-family="-apple-system,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#1d1d1f">Usage</text>
    <g font-family="-apple-system,Helvetica,sans-serif" font-size="13" fill="#1d1d1f">
      <g transform="translate(0 60)">
        <circle cx="34" cy="16" r="12" fill="#3b82f6"/><text x="58" y="21" font-weight="600">GLM · max</text>
        <rect x="24" y="40" width="330" height="6" rx="3" fill="#e5e5ea"/><rect x="24" y="40" width="38" height="6" rx="3" fill="#34c759"/>
        <text x="58" y="70" font-size="10" fill="#8e8e93" font-weight="600" fill-opacity="0.9">QUOTA RESET · 1 week left</text>
      </g>
      <g transform="translate(0 150)">
        <circle cx="34" cy="16" r="12" fill="#f59e0b"/><text x="58" y="21" font-weight="600">Claude · Pro</text>
        <rect x="24" y="40" width="330" height="6" rx="3" fill="#e5e5ea"/><rect x="24" y="40" width="330" height="6" rx="3" fill="#ff3b30"/>
        <text x="316" y="32" font-size="10" font-weight="700" fill="#ff3b30">100%</text>
        <text x="58" y="70" font-size="10" fill="#8e8e93" font-weight="600" fill-opacity="0.9">2 resets · expires 11/17</text>
      </g>
      <g transform="translate(0 240)">
        <circle cx="34" cy="16" r="12" fill="#10b981"/><text x="58" y="21" font-weight="600">DeepSeek</text>
        <text x="24" y="66" font-size="22" font-weight="700">$7.56</text><text x="105" y="66" font-size="11" fill="#8e8e93">USD</text>
      </g>
      <g transform="translate(0 320)">
        <circle cx="34" cy="16" r="12" fill="#6366f1"/><text x="58" y="21" font-weight="600">Codex</text>
        <rect x="24" y="40" width="330" height="6" rx="3" fill="#e5e5ea"/><rect x="24" y="40" width="36" height="6" rx="3" fill="#34c759"/>
      </g>
    </g>
  </g>
  <!-- headline -->
  <text x="80" y="180" font-family="-apple-system,Helvetica,sans-serif" font-size="52" font-weight="800" fill="#ffffff">All your AI coding</text>
  <text x="80" y="240" font-family="-apple-system,Helvetica,sans-serif" font-size="52" font-weight="800" fill="url(#accent)">subscriptions, one popup.</text>
  <text x="80" y="310" font-family="-apple-system,Helvetica,sans-serif" font-size="22" fill="#a8b3cf">GLM · Codex · Claude · DeepSeek · opencode go · Command Code</text>
  <text x="80" y="345" font-family="-apple-system,Helvetica,sans-serif" font-size="22" fill="#a8b3cf">Usage bars · quota resets · peak-hour clock · drag to reorder</text>
  <rect x="80" y="400" width="300" height="52" rx="26" fill="url(#accent)"/>
  <text x="230" y="433" text-anchor="middle" font-family="-apple-system,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#0f1117">dsh-usage-panel</text>
  <text x="80" y="500" font-family="-apple-system,Helvetica,sans-serif" font-size="16" fill="#6b7a99">for DeepSeek Harness — Node 18+, zero dependencies</text>
</svg>